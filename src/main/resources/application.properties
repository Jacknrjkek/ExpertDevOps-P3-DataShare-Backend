spring.application.name=datashare-backend
server.port=8080

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/datashare
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# File Upload Configuration
spring.servlet.multipart.max-file-size=1024MB
spring.servlet.multipart.max-request-size=1024MB

# JWT Configuration (Overridden by Env Var usually)
datashare.app.jwtSecret=ThisIsASecretKeyForTestThatIsLongEnoughToSatisfyHS512AlgorithmAndSecureYourApplicationContext
datashare.app.jwtExpirationMs=86400000
